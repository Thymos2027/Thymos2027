<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Zhiqiang Wang — LLM Inference and GPU Systems</title>
  <desc id="description">Dark blue banner with a subtle computational grid and cyan accents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172b41"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#44d7d0"/>
      <stop offset="1" stop-color="#78a9ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#93b6d4" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#background)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <path d="M 610 300 L 910 0 M 810 300 L 1110 0 M 1010 300 L 1200 110" stroke="#44d7d0" stroke-opacity="0.08" stroke-width="2"/>
    <path d="M 815 210 H 895 V 150 H 970 V 105 H 1070" fill="none" stroke="#44d7d0" stroke-opacity="0.48" stroke-width="2"/>
    <path d="M 900 260 V 225 H 1000 V 185 H 1115" fill="none" stroke="#78a9ff" stroke-opacity="0.40" stroke-width="2"/>
    <circle cx="895" cy="150" r="5" fill="#44d7d0"/>
    <circle cx="970" cy="105" r="5" fill="#44d7d0"/>
    <circle cx="1000" cy="185" r="5" fill="#78a9ff"/>
    <circle cx="1115" cy="185" r="5" fill="#78a9ff"/>
    <rect x="66" y="62" width="52" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="66" y="121" fill="#f3f8ff" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="1.5">ZHIQIANG WANG</text>
    <text x="68" y="169" fill="#6de1da" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" letter-spacing="2.3">LLM INFERENCE / GPU SYSTEMS</text>
    <text x="68" y="224" fill="#b4c7d8" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1.2">CUDA KERNELS   ·   PERFORMANCE PROFILING   ·   REPRODUCIBLE EXPERIMENTS</text>
    <rect x="66" y="249" width="1068" height="1" fill="#d2e5f4" opacity="0.18"/>
  </g>
</svg>
